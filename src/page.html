        <span class="ml-auto tabular-nums text-[11px] text-dim">${it.score}${it.at ? " · " + when(it.at) : ""}</span>
      </li>`;
  };
  return html`
    <${Panel} view="dig" title=${"Dig" + (keyword ? " · " + keyword : "")}>
      <form class="mb-3 flex max-w-lg gap-2" onSubmit=${(e) => { e.preventDefault(); onDig(q); }}>
        <input class=${inputCls + " min-w-0 flex-1"} type="search" value=${q} placeholder="everything the node knows about…"
               autocomplete="off" maxlength="200" onInput=${(e) => setQ(e.target.value)} />
        <button type="submit" class="shrink-0 rounded-lg bg-ember px-4 py-2 font-semibold text-ground shadow-lamp transition hover:brightness-110">Dig</button>
      </form>
      <div class=${msgCls(msg)}>${msg?.text || ""}</div>

      ${b && html`
        <div class="mt-2 flex flex-wrap items-center gap-2 text-[12px] text-dim">
          <span class=${"rounded-full px-2.5 py-0.5 font-semibold " + frictionCls(b.friction)}>friction ${b.friction} · ${b.confidence}</span>
          <span>dig #${b.dig_seq}</span>
          <span class="font-mono">${b.dug_by}</span>
          <span class="tabular-nums">${when(b.as_of)}</span>
          <span class="tabular-nums">${b.took_ms} ms</span>
          <a href=${"#/trace/" + encodeURIComponent(b.keyword)} class="ml-auto text-ember no-underline">its trace →</a>
        </div>
        ${memoryOnly && html`
          <p class="mt-2 rounded-lg border border-ember/40 bg-ember/10 px-3 py-2 text-[12px] leading-5">
            Asked before, never filed — the log knows this word and the corpus does not.
            <a class="text-ember" href="#/">File it?</a>
          </p>`}
        <div class="mt-3 flex flex-wrap gap-1.5">
          ${Object.entries(b.counts).map(([k, v]) => html`
            <span key=${k} class="rounded-full bg-chip px-2 py-0.5 font-mono text-[11px]" title=${v === null ? "no embedder: not looked, not an empty answer" : ""}>
              ${k}<span class="ml-1 tabular-nums opacity-60">${v === null ? "n/a" : v}</span>
            </span>`)}
        </div>

        ${grouped.length === 0
          ? html`<${Empty}>Nothing at or above the confident floor (15).<//>`
          : grouped.map(([tier, why, items]) => html`
            <div key=${tier} class="mt-4">
              <h3 class="mb-1 flex items-baseline gap-2 text-[11px] font-semibold uppercase tracking-[.08em] text-dim">
                <span>${tier}</span><span class="font-normal normal-case tracking-normal text-dim/70">${why}</span>
                <span class="ml-auto tabular-nums">${items.length}</span>
              </h3>
              <ol class="m-0 list-none p-0">${items.map((it) => html`<${Item} key=${it.source + ":" + it.id} it=${it} />`)}</ol>
            </div>`)}

        ${b.weak.length > 0 && html`
          <details class="yaml mt-4">
            <summary class="text-[12px] text-dim">${b.weak.length} below the confident floor — a signal, not a failure</summary>
            <ol class="m-0 mt-1 list-none p-0">${b.weak.map((it) => html`<${Item} key=${"w:" + it.source + ":" + it.id} it=${it} />`)}</ol>
          </details>`}

        ${b.traces && b.traces.count > 0 && html`
          <h3 class="mb-2 mt-5 text-[11px] font-semibold uppercase tracking-[.08em] text-dim">Sought ${b.traces.count}× by day</h3>
          <${Sparkline} days=${b.traces.days} />`}`}

      <h3 class="mb-2 mt-6 text-[11px] font-semibold uppercase tracking-[.08em] text-dim">Prior digs${keyword ? " of “" + keyword + "”" : ""}</h3>
      ${!history ? html`<${Empty}>Reading…<//>`
        : history.length === 0 ? html`<${Empty}>None yet${keyword ? " — this would be the first" : ""}.<//>`
        : html`
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-[12px]">
              <thead><tr class="text-left text-dim">
                ${["#", "when", "keyword", "friction", "who", "top", "ms"].map((h) => html`<th key=${h} class="border-b border-line px-2 py-1.5 font-semibold">${h}</th>`)}
              </tr></thead>
              <tbody>
                ${history.map((d) => html`
                  <tr key=${d.dig_seq} class="align-top">
                    <td class="border-b border-line px-2 py-1.5 tabular-nums text-dim">${d.dig_seq}</td>
                    <td class="whitespace-nowrap border-b border-line px-2 py-1.5 tabular-nums text-dim">${when(d.at)}</td>
                    <td class="border-b border-line px-2 py-1.5"><a href=${"#/dig/" + encodeURIComponent(d.keyword)} class="text-ink no-underline hover:text-ember">${d.keyword}</a></td>
                    <td class="border-b border-line px-2 py-1.5"><span class=${"rounded-full px-2 py-0.5 text-[11px] " + frictionCls(d.friction)}>${d.friction} · ${d.confidence}</span></td>
                    <td class="border-b border-line px-2 py-1.5 font-mono text-dim">${who(d) || "—"}</td>
                    <td class="border-b border-line px-2 py-1.5 tabular-nums">${(d.top || []).length}</td>
                    <td class="border-b border-line px-2 py-1.5 tabular-nums">${d.took_ms}</td>
                  </tr>`)}
              </tbody>
            </table>
          </div>`}
    <//>`;
}

/** #/traces — the raw log, windowed; the owner's view. */
function TracesView({ data, window, setWindow }) {
  return html`
    <${Panel} view="traces" title="Traces" action=${html`<${WindowToggle} value=${window} onChange=${setWindow} />`}>
      ${!data ? html`<${Empty}>Reading…<//>`
        : data.error ? html`<${Empty}>${data.error} — the raw log is owner-session and api-token only; an HA user reads their own rows under #/trace/‹keyword›.<//>`
        : data.traces.length === 0 ? html`<${Empty}>Nothing traced in this window.<//>`
        : html`
          <${TraceTable} rows=${data.traces} subject=${true} />
          <p class="mb-0 mt-3 text-[11px] leading-5 text-dim">
            ${data.traces.length} row${data.traces.length === 1 ? "" : "s"}, newest first (<code class="font-mono">at DESC, rowid DESC</code>), ${window}.
            Reads of this page are not traced — an observation must not observe itself.
          </p>`}
    <//>`;
}

/** Settings: what /api/health says about the janitor and retention. */
function Housekeeping({ health }) {
  const hk = health.housekeeping;
  const ret = health.retention || {};
  return html`
    <div class="mb-3 flex flex-wrap gap-x-7 gap-y-3">
      ${[["nodes", health.nodes], ["traces", health.traces], ["digs", health.digs], ["migrations", health.migrations]].map(([label, value]) => html`
        <div key=${label}>
          <b class="block text-[20px] font-semibold tabular-nums leading-tight">${value ?? 0}</b>
          <span class="text-[11px] text-dim">${label}</span>
        </div>`)}
    </div>
    <h3 class="mb-1 text-[11px] font-semibold uppercase tracking-[.08em] text-dim">Retention</h3>
    <div class="mb-3 flex flex-wrap gap-1.5">
      ${Object.entries(ret).map(([k, v]) => html`
        <span key=${k} class="rounded-full bg-chip px-2 py-0.5 font-mono text-[11px]">${k}<span class="ml-1 tabular-nums opacity-60">${String(v)}</span></span>`)}
    </div>
    <h3 class="mb-1 text-[11px] font-semibold uppercase tracking-[.08em] text-dim">Janitor</h3>
    ${!hk
      ? html`<${Empty}>Has not run yet — it runs on a schedule after boot and reports here.<//>`
      : html`
        <div class="grid gap-1 text-[12px]">
          <div class="flex flex-wrap gap-x-4 gap-y-1 text-dim">
            <span>last <span class="tabular-nums text-ink">${hk.last_at ? when(hk.last_at) : "—"}</span></span>
            <span>next <span class="tabular-nums text-ink">${hk.next_at ? when(hk.next_at) : "—"}</span></span>
            <span>free <span class="tabular-nums text-ink">${hk.data_free_mb ?? "—"}</span> MB</span>
            ${hk.warned && html`<span class="rounded-full bg-clay/20 px-2 py-0.5 text-clay">warned</span>`}
          </div>
          ${hk.evicted && html`<div><span class="text-dim">evicted</span> <${Yaml} raw=${JSON.stringify(hk.evicted)} /></div>`}
          ${hk.errors && (Array.isArray(hk.errors) ? hk.errors.length > 0 : true) && html`<div class="text-clay"><${Yaml} raw=${JSON.stringify(hk.errors)} /></div>`}
        </div>`}
    ${(health.protocol_versions_seen || []).length > 0 && html`
      <h3 class="mb-1 mt-3 text-[11px] font-semibold uppercase tracking-[.08em] text-dim">Protocol versions seen</h3>
      <div class="flex flex-wrap gap-1.5">
        ${health.protocol_versions_seen.map((p) => html`<span key=${p} class="rounded-full bg-chip px-2 py-0.5 font-mono text-[11px]">${p}</span>`)}
      </div>`}`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
